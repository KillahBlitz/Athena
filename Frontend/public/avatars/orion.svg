<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="orion-helmet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="orion-visor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <!-- Outer Helmet Ring / Collar -->
  <rect x="28" y="86" width="64" height="20" rx="8" fill="#CBD5E1"/>
  <rect x="34" y="90" width="52" height="12" rx="6" fill="#0284C7"/>

  <!-- Helmet Dome -->
  <circle cx="60" cy="56" r="38" fill="url(#orion-helmet)" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Visor -->
  <rect x="32" y="38" width="56" height="36" rx="18" fill="url(#orion-visor)" stroke="#0284C7" stroke-width="2"/>
  
  <!-- Visor Reflection -->
  <path d="M42 44 Q60 40 76 44 A14 14 0 0 1 76 50 Q60 46 42 50 Z" fill="#38BDF8" opacity="0.6"/>
  <ellipse cx="46" cy="46" rx="6" ry="2.5" fill="#FFFFFF" opacity="0.8"/>

  <!-- Earpieces -->
  <rect x="18" y="48" width="8" height="18" rx="4" fill="#0284C7"/>
  <rect x="94" y="48" width="8" height="18" rx="4" fill="#0284C7"/>
  <!-- Helmet Badge / Star -->
  <path d="M60 22 L62 26 L66 26 L63 29 L64 33 L60 30 L56 33 L57 29 L54 26 L58 26 Z" fill="#F59E0B"/>
