<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="nova-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E52FF"/>
      <stop offset="100%" stop-color="#6E31E8"/>
    </linearGradient>
    <linearGradient id="nova-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#211738"/>
      <stop offset="100%" stop-color="#140E26"/>
    </linearGradient>
    <linearGradient id="nova-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40FEFE"/>
      <stop offset="100%" stop-color="#01A5CB"/>
    </linearGradient>
    <filter id="screen-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Antenna -->
  <line x1="60" y1="12" x2="60" y2="24" stroke="#8E52FF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="60" cy="11" r="5" fill="#40FEFE" filter="url(#screen-glow)"/>
  
  <!-- Robot Head -->
  <rect x="22" y="24" width="76" height="54" rx="22" fill="url(#nova-body)"/>
  <!-- Ears / Headphones -->
  <rect x="15" y="38" width="8" height="26" rx="4" fill="#B388FF"/>
  <rect x="97" y="38" width="8" height="26" rx="4" fill="#B388FF"/>

  <!-- Face Screen -->
  <rect x="30" y="31" width="60" height="40" rx="14" fill="url(#nova-screen)"/>
  
  <!-- Glowing Eyes -->
  <ellipse cx="46" cy="49" rx="4.5" ry="5.5" fill="#40FEFE" filter="url(#screen-glow)"/>
  <ellipse cx="74" cy="49" rx="4.5" ry="5.5" fill="#40FEFE" filter="url(#screen-glow)"/>
  
  <!-- Friendly Smile -->
  <path d="M54 55 Q60 61 66 55" stroke="#40FEFE" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#screen-glow)"/>
  <!-- Rosy cheeks -->
  <circle cx="39" cy="56" r="3" fill="#FD3EFD" opacity="0.6"/>
  <circle cx="81" cy="56" r="3" fill="#FD3EFD" opacity="0.6"/>

  <!-- Body / Torso -->
  <path d="M38 80 L82 80 L86 102 A6 6 0 0 1 80 108 L40 108 A6 6 0 0 1 34 102 Z" fill="url(#nova-body)"/>
  <!-- Glowing Chest Emblem (Star / Inverted V) -->
  <circle cx="60" cy="94" r="8" fill="#140E26"/>
  <path d="M60 89 L64 97 L56 97 Z" fill="#40FEFE" filter="url(#screen-glow)"/>
  <!-- Limbs hints -->
  <circle cx="34" cy="88" r="4.5" fill="#7C43BD"/>
  <circle cx="86" cy="88" r="4.5" fill="#7C43BD"/>
</svg>