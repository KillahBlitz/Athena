<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <rect width="48" height="48" rx="12" fill="#F0F9FF"/>
  <!-- DNA strands crossing -->
  <path d="M16 14 C24 20, 24 28, 32 34" stroke="#8E52FF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M32 14 C24 20, 24 28, 16 34" stroke="#8E52FF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Connecting rungs -->
  <line x1="18" y1="17" x2="30" y2="17" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
  <line x1="21" y1="24" x2="27" y2="24" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="31" x2="30" y2="31" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
  <!-- Nodes -->
  <circle cx="16" cy="14" r="2.5" fill="#8E52FF"/>
  <circle cx="32" cy="14" r="2.5" fill="#40FEFE"/>
  <circle cx="16" cy="34" r="2.5" fill="#40FEFE"/>
  <circle cx="32" cy="34" r="2.5" fill="#8E52FF"/>
</svg>