<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <rect width="48" height="48" rx="12" fill="#F4EDFF"/>
  <!-- Central nucleus -->
  <circle cx="24" cy="24" r="3.5" fill="#8E52FF"/>
  <!-- Orbit 1 -->
  <ellipse cx="24" cy="24" rx="15" ry="6" stroke="#8E52FF" stroke-width="2" fill="none" transform="rotate(30 24 24)"/>
  <!-- Orbit 2 -->
  <ellipse cx="24" cy="24" rx="15" ry="6" stroke="#8E52FF" stroke-width="2" fill="none" transform="rotate(-30 24 24)"/>
  <!-- Orbit 3 -->
  <ellipse cx="24" cy="24" rx="15" ry="6" stroke="#8E52FF" stroke-width="2" fill="none" transform="rotate(90 24 24)"/>
  <!-- Orbiting dots -->
  <circle cx="35" cy="18" r="2" fill="#FD3EFD"/>
  <circle cx="13" cy="30" r="2" fill="#8E52FF"/>
</svg>