services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: always

    environment:
      POSTGRES_DB: athena
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena -d athena"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx_postgres:
    image: nginx:latest
    container_name: nginx_proxy_postgres
    restart: always

    ports:
      - "5432:5432"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: