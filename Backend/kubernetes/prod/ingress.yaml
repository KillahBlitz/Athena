apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: athena-ingress
  namespace: dev-athena
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - http:
        paths:
          - path: /api/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: athena-api-service
                port:
                  number: 8000
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: athena-frontend-service
                port:
                  number: 3000
