apiVersion: apps/v1
kind: Deployment
metadata:
  name: athena-redis
  namespace: dev-athena
  labels:
    app: athena-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: athena-redis
  template:
    metadata:
      labels:
        app: athena-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: dev-athena
  labels:
    app: athena-redis
spec:
  type: ClusterIP
  selector:
    app: athena-redis
  ports:
    - port: 6379
      targetPort: 6379
