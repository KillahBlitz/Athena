name: Athena CI/CD

on:
  push:
    branches:
      - devel

jobs:
  ValidateConection:
    runs-on: [self-hosted, k3s-devel]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validar estado del clúster K3s local
        run: |
          echo "✅ Conexión al servidor local exitosa."
          kubectl get nodes
          
          echo "🔍 Verificando el entorno aislado (dev-athena)..."
          kubectl get pods -n dev-athena

      - name: Validar Autenticación y Artifact Registry
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          # Crear archivo temporal para servicio
          echo '${{ secrets.GCP_SA_KEY }}' > "${HOME}/key.json"
          
          # Autenticar en Google Cloud y Docker
          gcloud auth activate-service-account --key-file="${HOME}/key.json"
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          echo "✅ Autenticación en Google Cloud exitosa."
          
          # Confirmar acceso a Artifact Registry listando los repositorios
          echo "Listando repositorios en us-central1 para verificar permisos:"
          gcloud artifacts repositories list --location=us-central1 --project=$PROJECT_ID
          
          # Limpiar la llave por seguridad
          rm "${HOME}/key.json"

  publish-library:
    runs-on: ubuntu-latest
    needs: ValidateConection
    defaults:
      run:
        working-directory: ./library

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for changes in setup.py
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            setup:
              - 'library/setup.py'

      - name: Set up Python
        if: steps.filter.outputs.setup == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build dependencies
        if: steps.filter.outputs.setup == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        if: steps.filter.outputs.setup == 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.filter.outputs.setup == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
